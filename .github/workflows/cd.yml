name: CD
run-name: Deploy ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  publish-images:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todoapp-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todoapp-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy production
    needs: publish-images
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/home/dung/todoapp' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME:-}" || -z "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "Missing required secret: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN" >&2
            exit 1
          fi

          TARGET_DIR="${DEPLOY_PATH:-$HOME/todoapp}"
          mkdir -p "${TARGET_DIR}"

          # Ensure backend/.env exists before starting
          if [[ ! -f "${TARGET_DIR}/backend/.env" ]]; then
            echo "Error: ${TARGET_DIR}/backend/.env does not exist on server!" >&2
            echo "Please create ${TARGET_DIR}/backend/.env with your production environment variables." >&2
            exit 1
          fi

          # Copy production Compose file to deploy folder
          cp docker-compose.prod.yml "${TARGET_DIR}/docker-compose.prod.yml"

          cd "${TARGET_DIR}"

          # Log in to Docker Hub on server
          printf '%s' "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin

          # Pull the latest published images
          DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}" IMAGE_TAG="${GITHUB_SHA}" \
            docker compose -f docker-compose.prod.yml pull

          # Start or update containers
          DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}" IMAGE_TAG="${GITHUB_SHA}" \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 120

          # Check container status
          DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}" IMAGE_TAG="${GITHUB_SHA}" \
            docker compose -f docker-compose.prod.yml ps
