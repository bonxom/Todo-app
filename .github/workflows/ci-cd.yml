name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Type-check backend
        working-directory: backend
        run: pnpm run build

      - name: Test backend
        working-directory: backend
        run: pnpm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  build-pr-images:
    name: Build ${{ matrix.service }} image
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          push: false
          tags: todoapp-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-images:
    name: Publish ${{ matrix.service }} image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todoapp-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/todoapp-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          required=(DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DOCKERHUB_USERNAME DOCKERHUB_TOKEN)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done

          install -d -m 700 "${RUNNER_TEMP}/todoapp-ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${RUNNER_TEMP}/todoapp-ssh/id_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${RUNNER_TEMP}/todoapp-ssh/known_hosts"
          chmod 600 "${RUNNER_TEMP}/todoapp-ssh/id_deploy" "${RUNNER_TEMP}/todoapp-ssh/known_hosts"

      - name: Upload production Compose file
        shell: bash
        run: |
          set -euo pipefail
          SSH_KEY="${RUNNER_TEMP}/todoapp-ssh/id_deploy"
          KNOWN_HOSTS="${RUNNER_TEMP}/todoapp-ssh/known_hosts"
          SSH_TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh -i "${SSH_KEY}" -p "${DEPLOY_PORT}" \
            -o UserKnownHostsFile="${KNOWN_HOSTS}" \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET}" "mkdir -p '${DEPLOY_PATH}'"

          scp -i "${SSH_KEY}" -P "${DEPLOY_PORT}" \
            -o UserKnownHostsFile="${KNOWN_HOSTS}" \
            -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml \
            "${SSH_TARGET}:${DEPLOY_PATH}/docker-compose.prod.yml"

      - name: Pull images and restart containers
        shell: bash
        run: |
          set -euo pipefail
          SSH_KEY="${RUNNER_TEMP}/todoapp-ssh/id_deploy"
          KNOWN_HOSTS="${RUNNER_TEMP}/todoapp-ssh/known_hosts"
          SSH_TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          printf '%s' "${DOCKERHUB_TOKEN}" | ssh -i "${SSH_KEY}" -p "${DEPLOY_PORT}" \
            -o UserKnownHostsFile="${KNOWN_HOSTS}" \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET}" "docker login --username '${DOCKERHUB_USERNAME}' --password-stdin"

          ssh -i "${SSH_KEY}" -p "${DEPLOY_PORT}" \
            -o UserKnownHostsFile="${KNOWN_HOSTS}" \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET}" \
            "cd '${DEPLOY_PATH}' && \
             test -f backend/.env && \
             DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' IMAGE_TAG='${GITHUB_SHA}' docker compose -f docker-compose.prod.yml pull && \
             DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' IMAGE_TAG='${GITHUB_SHA}' docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 120 && \
             DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' IMAGE_TAG='${GITHUB_SHA}' docker compose -f docker-compose.prod.yml ps"
